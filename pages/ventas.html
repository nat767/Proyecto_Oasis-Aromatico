<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ventas - Oasis Aromático</title>

    <link rel="stylesheet" href="../css/dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <aside class="sidebar">

        <div class="brand">

            <img src="../img/logo.png">

            <h2>Oasis Aromático</h2>

        </div>

        <nav>

            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Inicio
            </a>

            <a href="productos.html">
                <i class="fa-solid fa-spray-can-sparkles"></i>
                Productos
            </a>

            <a href="inventario.html">
                <i class="fa-solid fa-boxes-stacked"></i>
                Inventario
            </a>

            <a href="proveedores.html">

    <i class="fa-solid fa-truck"></i>

    Proveedores

</a>

            <a href="clientes.html">
                <i class="fa-solid fa-users"></i>
                Clientes
            </a>

            <a class="active" href="ventas.html">
                <i class="fa-solid fa-cart-shopping"></i>
                Ventas
            </a>

            <a href="reportes.html">
                <i class="fa-solid fa-chart-line"></i>
                Reportes
            </a>

            <a href="configuracion.html">
                <i class="fa-solid fa-gear"></i>
                Configuración
            </a>

            <a href="../index.html">

    <i class="fa-solid fa-right-from-bracket"></i>

    Cerrar sesión

</a>

        </nav>

    </aside>

    <main class="contenido">

        <header>

            <button class="menu-btn">

                <i class="fa-solid fa-bars"></i>

            </button>

            <h1>Registro de Ventas</h1>

        </header>

        <section class="tabla">

            <h2>Nueva venta</h2>

            <form id="formVentas" class="formulario">

                <select>

                    <option>Seleccionar perfume</option>

                    <option>Versace Eros</option>

                    <option>212 VIP</option>

                    <option>One Million</option>

                </select>

                <input
                    type="number"
                    placeholder="Cantidad">

                <input
                    type="number"
                    placeholder="Precio">

                <input
                    type="text"
                    placeholder="Total"
                    readonly>

                <button type="submit">

                    Registrar venta

                </button>

            </form>

        </section>

        <section class="tabla">

            <h2>Historial de ventas</h2>

            <table>

                <thead>

                    <tr>

                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Total</th>

                    </tr>

                </thead>

                <tbody id="tablaVentas">

                    <tr>

                        <td>Versace Eros</td>
                        <td>2</td>
                        <td>$250.000</td>
                        <td>$500.000</td>

                    </tr>

                    <tr>

                        <td>212 VIP</td>
                        <td>1</td>
                        <td>$90.000</td>
                        <td>$90.000</td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <script src="../js/dashboard.js"></script>

</body>

</html>
